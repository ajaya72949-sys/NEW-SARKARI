<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resize, crop and compress a signature image in your browser.">
  <title>Signature Resizer | New SARKARI UPDATES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="signature-page">
  <main class="signature-page-wrap">
    <a class="signature-back-link" href="index.html">← Back to New SARKARI UPDATES</a>
    <header class="signature-tool-header">
      <h1>Signature Resizer</h1>
      <p>Crop with your finger or mouse, choose the required dimensions and download. Your image stays on this device.</p>
    </header>

    <section class="signature-tool-card" aria-label="Signature image editor">
      <label class="signature-upload" id="signature-drop-area" for="signature-file">
        <span class="signature-upload-icon" aria-hidden="true">↑</span>
        <strong>Upload your signature</strong>
        <span>Drop an image here or <span class="signature-browse">browse image</span></span>
        <small>JPG, PNG or WEBP</small>
        <input id="signature-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      </label>

      <div class="signature-editor" id="signature-editor" hidden>
        <p class="signature-file-info" id="signature-file-info"></p>
        <div class="signature-preview-wrap" id="signature-preview-wrap">
          <canvas id="signature-preview" aria-label="Signature preview. Drag to select a crop area."></canvas>
          <span class="signature-crop-hint" id="signature-crop-hint" hidden>Drag on the image to select a crop area</span>
        </div>
        <div class="signature-actions signature-edit-actions">
          <button type="button" id="signature-crop-toggle" aria-pressed="false">✂ Crop</button>
          <button type="button" id="signature-crop-apply" disabled>Apply crop</button>
          <button type="button" id="signature-rotate-left" aria-label="Rotate left">↶ Rotate left</button>
          <button type="button" id="signature-rotate-right" aria-label="Rotate right">Rotate right ↷</button>
        </div>

        <div class="signature-controls signature-unit-controls">
          <label>Units
            <select id="signature-unit">
              <option value="px">Pixels (px)</option>
              <option value="cm">Centimeters (cm)</option>
              <option value="in">Inches (in)</option>
            </select>
          </label>
          <label>Width<input id="signature-width" type="number" min="0.01" step="any" value="140"></label>
          <label>Height<input id="signature-height" type="number" min="0.01" step="any" value="60"></label>
          <label>DPI<input id="signature-dpi" type="number" min="1" max="2400" step="1" value="200"></label>
          <label>Target size (KB)<input id="signature-size" type="number" min="1" step="0.1" value="20"></label>
        </div>
        <label class="signature-ratio"><input id="signature-ratio" type="checkbox" checked> Maintain aspect ratio</label>

        <div class="signature-actions">
          <button type="button" class="signature-primary" id="signature-process">Resize &amp; compress</button>
          <button type="button" class="signature-reset" id="signature-reset">Choose another image</button>
        </div>
        <p class="signature-status" id="signature-status" role="status" aria-live="polite"></p>
        <a class="signature-download" id="signature-download" hidden download="resized-signature.jpg">Download signature</a>
      </div>
    </section>
  </main>
</body>
</html>
