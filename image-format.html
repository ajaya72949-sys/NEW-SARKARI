<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert an image to JPEG, PNG or WEBP locally in your browser.">
  <title>Image Format Converter | New SARKARI UPDATES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="signature-page">
  <main class="signature-page-wrap local-tool-page">
    <a class="signature-back-link" href="index.html">← Back to New SARKARI UPDATES</a>
    <header class="signature-tool-header"><h1>Image Format Converter</h1><p>Convert an image to JPEG, PNG or WEBP. Your image is processed locally.</p></header>
    <section class="signature-tool-card local-tool-card">
      <label class="local-tool-label" for="format-image">Choose image</label>
      <input class="local-tool-input" id="format-image" type="file" accept="image/jpeg,image/png,image/webp">
      <label class="local-tool-label" for="format-type">Output format</label>
      <select class="local-tool-input" id="format-type"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select>
      <label class="local-tool-label" for="format-quality">Quality (JPEG / WEBP)</label>
      <input class="local-tool-input" id="format-quality" type="range" min="10" max="100" value="90">
      <span class="local-tool-help" id="format-quality-value">90%</span>
      <button class="local-tool-primary" id="format-download" type="button">Convert &amp; download</button>
      <p class="local-tool-status" id="format-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
