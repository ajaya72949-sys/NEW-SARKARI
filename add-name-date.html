<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add a name and date to a photo in your browser.">
  <title>Add Name &amp; Date on Photo | New SARKARI UPDATES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="signature-page">
  <main class="signature-page-wrap local-tool-page">
    <a class="signature-back-link" href="index.html">← Back to New SARKARI UPDATES</a>
    <header class="signature-tool-header"><h1>Add Name &amp; Date on Photo</h1><p>Add a caption and date to your photo, then download it. Image processing stays on this device.</p></header>
    <section class="signature-tool-card local-tool-card">
      <label class="local-tool-label" for="caption-image">Choose a photo</label>
      <input class="local-tool-input" id="caption-image" type="file" accept="image/jpeg,image/png,image/webp">
      <label class="local-tool-label" for="caption-name">Name / caption</label>
      <input class="local-tool-input" id="caption-name" type="text" maxlength="80" placeholder="Enter name or caption">
      <label class="local-tool-label" for="caption-date">Date</label>
      <input class="local-tool-input" id="caption-date" type="date">
      <label class="local-tool-label" for="caption-position">Text position</label>
      <select class="local-tool-input" id="caption-position"><option value="bottom">Bottom</option><option value="top">Top</option></select>
      <img class="local-tool-preview" id="caption-preview" alt="Photo preview" hidden>
      <button class="local-tool-primary" id="caption-download" type="button">Add text &amp; download</button>
      <p class="local-tool-status" id="caption-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
