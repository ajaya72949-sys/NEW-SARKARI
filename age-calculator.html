<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculate age between two dates.">
  <title>Age Calculator | New SARKARI UPDATES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="signature-page">
  <main class="signature-page-wrap local-tool-page">
    <a class="signature-back-link" href="index.html">← Back to New SARKARI UPDATES</a>
    <header class="signature-tool-header"><h1>Age Calculator</h1><p>Calculate your age in years, months and days.</p></header>
    <section class="signature-tool-card local-tool-card">
      <label class="local-tool-label" for="age-dob">Date of birth</label>
      <input class="local-tool-input" id="age-dob" type="date">
      <label class="local-tool-label" for="age-as-of">Calculate age as of</label>
      <input class="local-tool-input" id="age-as-of" type="date">
      <button class="local-tool-primary" id="calculate-age" type="button">Calculate Age</button>
      <p class="local-tool-result" id="age-result" role="status" aria-live="polite">Enter both dates to calculate.</p>
    </section>
  </main>
</body>
</html>
