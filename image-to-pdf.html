<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert images into a PDF document locally in your browser.">
  <title>Image to PDF | New SARKARI UPDATES</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="signature-page">
  <main class="signature-page-wrap local-tool-page">
    <a class="signature-back-link" href="index.html">← Back to New SARKARI UPDATES</a>
    <header class="signature-tool-header"><h1>Image to PDF</h1><p>Select one or more images and create a downloadable PDF. Files are processed on your device.</p></header>
    <section class="signature-tool-card local-tool-card">
      <label class="local-tool-label" for="pdf-images">Choose images (JPG, PNG or WEBP)</label>
      <input class="local-tool-input" id="pdf-images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <p class="local-tool-help" id="pdf-file-list">No images selected.</p>
      <button class="local-tool-primary" id="make-pdf" type="button">Create PDF</button>
      <p class="local-tool-status" id="pdf-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
